{% extends 'base.html' %}
{% block title %}Login - MediConnect{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
                    <form method="post">
                        {% csrf_token %}
                        {% if form.non_field_errors %}
                            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                        {% endif %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            {{ form.password }}
                        </div>
                        <button class="btn btn-primary w-100">Login</button>
                        <div class="text-center mt-3">
                            <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
                        </div>
                        <p class="text-center mt-2 mb-0">
                            New here? <a href="{% url 'accounts:register' %}">Create an account</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
