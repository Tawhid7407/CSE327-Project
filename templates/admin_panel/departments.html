{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between mb-3">
        <h3><i class="bi bi-hospital"></i> Departments</h3>
        <a href="{% url 'departments:create' %}" class="btn btn-primary"><i class="bi bi-plus"></i> Add Department</a>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>Name</th><th>Description</th><th>Icon</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for d in departments %}
                    <tr>
                        <td><strong>{{ d.name }}</strong></td>
                        <td>{{ d.description|truncatechars:60 }}</td>
                        <td><i class="bi {{ d.icon }}"></i> {{ d.icon }}</td>
                        <td>
                            <a href="{% url 'departments:edit' d.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a href="{% url 'departments:delete' d.pk %}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this department?')">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center text-muted py-4">No departments yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
