{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h3 class="mb-3"><i class="bi bi-envelope"></i> Feedback Messages</h3>
    <div class="accordion" id="feedbackList">
    {% for f in feedbacks %}
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#f{{ f.pk }}">
                    <strong>{{ f.subject }}</strong> &nbsp;—&nbsp; <span class="text-muted">{{ f.name }} ({{ f.email }})</span>
                    &nbsp;<small class="text-muted ms-auto">{{ f.created_at|date:"M d, Y" }}</small>
                </button>
            </h2>
            <div id="f{{ f.pk }}" class="accordion-collapse collapse" data-bs-parent="#feedbackList">
                <div class="accordion-body">{{ f.message }}</div>
            </div>
        </div>
    {% empty %}
        <p class="text-center text-muted py-4">No feedback messages.</p>
    {% endfor %}
    </div>
</div>
{% endblock %}
