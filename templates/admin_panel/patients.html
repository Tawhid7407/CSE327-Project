{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h3 class="mb-3"><i class="bi bi-people"></i> Manage Patients</h3>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for u in patients %}
                    <tr>
                        <td>{{ u.get_full_name }}<br><small class="text-muted">@{{ u.username }}</small></td>
                        <td>{{ u.email }}</td>
                        <td>{{ u.phone|default:"—" }}</td>
                        <td>{{ u.created_at|date:"M d, Y" }}</td>
                        <td>
                            <a href="{% url 'authority:delete_patient' u.pk %}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this patient?')">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="5" class="text-center text-muted py-4">No patients.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
