{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4><i class="bi bi-person-gear"></i> Doctor Profile</h4>
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Department</label>
                                {{ form.department }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Specialization</label>
                                {{ form.specialization }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Qualification</label>
                                {{ form.qualification }}
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Experience (years)</label>
                                {{ form.experience_years }}
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Fee</label>
                                {{ form.consultation_fee }}
                            </div>
                            <div class="col-12">
                                <label class="form-label">Bio</label>
                                {{ form.bio }}
                            </div>
                            <div class="col-12 form-check ms-3">
                                {{ form.is_available }}
                                <label class="form-check-label">Currently accepting appointments</label>
                            </div>
                        </div>
                        <button class="btn btn-primary mt-3">Save Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
