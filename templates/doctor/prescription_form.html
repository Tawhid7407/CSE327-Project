{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4><i class="bi bi-file-medical"></i> Write Prescription</h4>
                    <p class="text-muted">For {{ appointment.patient.user.get_full_name }} — {{ appointment.appointment_date }}</p>
                    <hr>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Diagnosis</label>
                            {{ form.diagnosis }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Medicines</label>
                            {{ form.medicines }}
                            <small class="text-muted">One medicine per line</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Advice</label>
                            {{ form.advice }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Follow-up Date (Optional)</label>
                            {{ form.follow_up_date }}
                        </div>
                        <button class="btn btn-primary">Save Prescription</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
