{% extends 'base.html' %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container py-4">
    <h3 class="mb-4"><i class="bi bi-bell"></i> Notifications</h3>
    <div class="list-group">
        {% for n in notifications %}
            <a href="{% url 'notifications:mark_read' n.pk %}"
               class="list-group-item list-group-item-action {% if not n.is_read %}fw-bold{% endif %}">
                {{ n.message }}
                <br><small class="text-muted">{{ n.created_at|timesince }} ago</small>
            </a>
        {% empty %}
            <p class="text-muted">No notifications yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
