{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4>{{ title }}</h4>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Condition</label>
                            {{ form.condition }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Diagnosed Date</label>
                            {{ form.diagnosed_date }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            {{ form.notes }}
                        </div>
                        <button class="btn btn-primary">Save</button>
                        <a href="{% url 'core:medical_history_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
