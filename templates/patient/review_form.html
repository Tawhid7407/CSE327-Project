{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4>Review Dr. {{ doctor.user.get_full_name }}</h4>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            {{ form.rating }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Comment</label>
                            {{ form.comment }}
                        </div>
                        <button class="btn btn-primary">Submit Review</button>
                        <a href="{% url 'doctors:detail' doctor.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
